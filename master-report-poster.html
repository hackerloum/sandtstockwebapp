<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>Master Report</title>
  <style>
    @page { size: 1080px 1080px; margin: 0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 1080px; overflow: hidden; }
    body { font-family: Arial, Helvetica, sans-serif; background: #f1eee6; color: #111111; }
    .poster { position: relative; width: 1080px; height: 1080px; background: #f1eee6; overflow: hidden; }
    .blue-block { position: absolute; top: 0; right: 0; width: 255px; height: 1080px; background: #175cff; }
    .top-rule { position: absolute; left: 72px; top: 70px; width: 735px; height: 4px; background: #111111; }
    .edition { position: absolute; left: 72px; top: 93px; font-size: 22px; font-weight: 700; letter-spacing: 4px; }
    .index { position: absolute; left: 646px; top: 93px; font-size: 22px; font-weight: 700; letter-spacing: 2px; }
    .red-dot { position: absolute; left: 782px; top: 96px; width: 15px; height: 15px; border-radius: 50%; background: #ff3b2f; }
    .headline { position: absolute; left: 64px; top: 178px; width: 820px; font-family: Impact, "Arial Black", Arial, sans-serif; font-size: 176px; line-height: 0.78; letter-spacing: -5px; font-weight: 900; text-transform: uppercase; }
    .headline span { display: block; }
    .subhead { position: absolute; left: 72px; top: 554px; width: 610px; font-size: 36px; line-height: 1.12; font-weight: 600; letter-spacing: -1px; }
    .subhead .accent { color: #175cff; }
    .chart { position: absolute; left: 72px; top: 671px; width: 680px; height: 220px; border-top: 2px solid #111111; border-bottom: 2px solid #111111; }
    .grid-v { position: absolute; top: 0; height: 216px; width: 1px; background: #aaa69c; }
    .v1 { left: 136px; } .v2 { left: 272px; } .v3 { left: 408px; } .v4 { left: 544px; }
    .grid-h { position: absolute; left: 0; width: 680px; height: 1px; background: #aaa69c; }
    .h1 { top: 72px; } .h2 { top: 144px; }
    .segment { position: absolute; height: 5px; background: #175cff; transform-origin: left center; }
    .s1 { left: 18px; top: 160px; width: 154px; transform: rotate(-12deg); }
    .s2 { left: 168px; top: 128px; width: 145px; transform: rotate(8deg); }
    .s3 { left: 309px; top: 148px; width: 168px; transform: rotate(-24deg); }
    .s4 { left: 462px; top: 80px; width: 190px; transform: rotate(-18deg); }
    .point { position: absolute; width: 15px; height: 15px; border-radius: 50%; background: #f1eee6; border: 4px solid #175cff; }
    .p1 { left: 12px; top: 152px; } .p2 { left: 162px; top: 120px; } .p3 { left: 303px; top: 140px; }
    .p4 { left: 456px; top: 72px; } .p5 { left: 635px; top: 16px; background: #ff3b2f; border-color: #ff3b2f; }
    .chart-label { position: absolute; top: 236px; font-size: 17px; font-weight: 700; letter-spacing: 2px; }
    .label-a { left: 0; } .label-b { left: 266px; } .label-c { right: 0; }
    .footer-rule { position: absolute; left: 72px; bottom: 95px; width: 680px; height: 2px; background: #111111; }
    .footer { position: absolute; left: 72px; bottom: 53px; font-size: 19px; font-weight: 700; letter-spacing: 4px; }
    .vertical-copy { position: absolute; right: 89px; top: 82px; height: 900px; color: #ffffff; writing-mode: vertical-rl; transform: rotate(180deg); font-size: 22px; font-weight: 700; letter-spacing: 5px; }
    .issue-no { position: absolute; right: 63px; bottom: 53px; color: #ffffff; font-family: Impact, "Arial Black", sans-serif; font-size: 76px; line-height: 1; }
  </style>
</head>
<body>
  <main class="poster">
    <div class="blue-block"></div>
    <div class="top-rule"></div>
    <div class="edition">EXECUTIVE INTELLIGENCE</div>
    <div class="index">VOL. 01</div>
    <div class="red-dot"></div>

    <div class="headline"><span>MASTER</span><span>REPORT</span></div>
    <div class="subhead">From raw data to <span class="accent">decisive action.</span></div>

    <div class="chart">
      <div class="grid-v v1"></div><div class="grid-v v2"></div><div class="grid-v v3"></div><div class="grid-v v4"></div>
      <div class="grid-h h1"></div><div class="grid-h h2"></div>
      <div class="segment s1"></div><div class="segment s2"></div><div class="segment s3"></div><div class="segment s4"></div>
      <div class="point p1"></div><div class="point p2"></div><div class="point p3"></div><div class="point p4"></div><div class="point p5"></div>
      <div class="chart-label label-a">ANALYZE</div><div class="chart-label label-b">UNDERSTAND</div><div class="chart-label label-c">LEAD</div>
    </div>

    <div class="footer-rule"></div>
    <div class="footer">CLARITY / INSIGHT / IMPACT</div>
    <div class="vertical-copy">MASTER REPORT — INTELLIGENCE, REFINED</div>
    <div class="issue-no">01</div>
  </main>
</body>
</html>
